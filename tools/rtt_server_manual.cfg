# 手动 RTT 服务器启动（配合 target/stm32g431/openocd.cfg）
# 关键：与烧录一致使用 reset_config connect_assert_srst（复位下连接），
# 否则固件运行后普通连接失败（"cannot read IDR"）。
adapter speed 8000
tcl_port 0
reset_config connect_assert_srst
init
rtt setup 0x2000002c 0xa8 "SEGGER RTT"
rtt start
rtt polling_interval 1
rtt server start 9090 0
rtt server start 9091 1
