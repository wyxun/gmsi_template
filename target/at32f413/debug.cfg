# Debug script: halt, set breakpoint, run, read exception frame
init
reset halt

# Hardware breakpoint at HardFault_Handler (Default_Handler alias)
bp 0x08002154 2 hw

# Resume — will stop at HardFault_Handler if fault occurs
resume

# If stopped at HardFault_Handler, read MSP and exception frame
echo "=== CPU STATE ==="
reg pc
reg msp
reg xpsr

echo "=== FAULT REGISTERS ==="
mdw 0xE000ED28 1
mdw 0xE000ED2C 1

echo "=== EXCEPTION FRAME (at MSP) ==="
# Will use MSP from reg read above; for now use fixed address
mdw 0x2000FFD0 8

exit
